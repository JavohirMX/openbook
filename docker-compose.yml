services:
  openbook:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://openbook:openbook@db:5432/openbook}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,books.javohirmx.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://books.javohirmx.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://books.javohirmx.com}
      TIME_ZONE: ${TIME_ZONE:-Asia/Tashkent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METADATA_IMPORT_DELAY_SECONDS: ${METADATA_IMPORT_DELAY_SECONDS:-0}
      IMPORT_GOODREADS_ENRICH_METADATA: ${IMPORT_GOODREADS_ENRICH_METADATA:-false}
      IMPORT_JOB_AUTO_PROCESS: "false"
      OPENLIBRARY_CONTACT_EMAIL: ${OPENLIBRARY_CONTACT_EMAIL:-}
    volumes:
      - openbook_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbook.rule=Host(`books.javohirmx.com`)"
      - "traefik.http.routers.openbook.entrypoints=websecure"
      - "traefik.http.services.openbook.loadbalancer.server.port=8000"
    networks:
      - web

  worker:
    build: .
    entrypoint: ["/app/scripts/docker-entrypoint.sh"]
    command: ["python", "manage.py", "process_import_jobs", "--loop"]
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://openbook:openbook@db:5432/openbook}
      TIME_ZONE: ${TIME_ZONE:-Asia/Tashkent}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METADATA_IMPORT_DELAY_SECONDS: ${METADATA_IMPORT_DELAY_SECONDS:-0}
      IMPORT_GOODREADS_ENRICH_METADATA: ${IMPORT_GOODREADS_ENRICH_METADATA:-false}
      OPENLIBRARY_CONTACT_EMAIL: ${OPENLIBRARY_CONTACT_EMAIL:-}
    volumes:
      - openbook_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openbook
      POSTGRES_PASSWORD: openbook
      POSTGRES_DB: openbook
    volumes:
      - openbook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbook -d openbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  openbook_pgdata:
  openbook_media:

networks:
  web:
    external: true
