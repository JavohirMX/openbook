{% extends "base.html" %}
{% load static %}
{% block title %}{{ title }} — openbook{% endblock %}
{% block extra_head %}
<script src="{% static 'books/barcode.js' %}" defer></script>
<script src="{% static 'books/cover-upload.js' %}" defer></script>
{% endblock %}
{% block content %}
<h1 class="page-title mb-6">{{ title }}</h1>

<div class="surface-padded max-w-2xl mb-4">
  <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1" for="epub-file-input">EPUB / OPF metadata</label>
  <form hx-post="{% url 'web:book-epub-metadata' %}" hx-target="#book-form-fields" hx-encoding="multipart/form-data" class="flex gap-2 items-center">
    {% csrf_token %}
    <input type="file" name="epub_file" id="epub-file-input" accept=".epub,.opf,application/epub+zip" class="file-input text-sm flex-1">
    <button type="submit" class="btn-secondary text-sm shrink-0">Import metadata</button>
  </form>
</div>

<form method="post" enctype="multipart/form-data" class="surface-padded max-w-2xl" data-disable-on-submit>
  {% csrf_token %}
  <div class="mb-4">
    <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1" for="metadata-search-input">Search by title or author</label>
    <input type="search" id="metadata-search-input" name="q" placeholder="Title, author…"
           class="input"
           hx-get="{% url 'web:book-search-metadata' %}" hx-trigger="input changed delay:400ms" hx-target="#metadata-search-results" hx-indicator="#metadata-search-loading">
    <div id="metadata-search-loading" class="htmx-indicator text-sm text-neutral-600 dark:text-neutral-400 mt-2">Searching…</div>
    <div id="metadata-search-results" class="mt-3"></div>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1" for="isbn-lookup-input">ISBN (lookup)</label>
    <div class="flex gap-2">
      <input type="text" name="isbn" id="isbn-lookup-input" value="{{ form.isbn.value|default:'' }}"
             class="input flex-1"
             hx-get="{% url 'web:book-lookup' %}" hx-trigger="change delay:500ms" hx-include="#isbn-lookup-input" hx-target="#lookup-result" hx-indicator="#lookup-loading">
      <button type="button" id="barcode-scan-btn" class="btn-secondary text-sm shrink-0">Scan barcode</button>
    </div>
    <div id="lookup-loading" class="htmx-indicator text-sm text-neutral-600 dark:text-neutral-400 mt-2">Looking up…</div>
    <div id="lookup-result" class="mt-2 text-sm text-neutral-600 dark:text-neutral-400"></div>
  </div>
  <div id="book-form-fields">
    {% include "books/partials/form_fields.html" %}
  </div>
  <div class="mt-6 flex gap-3">
    <button type="submit" class="btn-primary" data-loading-text="Saving…">Save</button>
    <a href="{% url 'web:book-list' %}" class="btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
