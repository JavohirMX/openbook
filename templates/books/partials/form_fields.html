{% for field in form.visible_fields %}
{% if field.name != 'isbn' %}
<div class="mb-4">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}<p class="mt-1 text-sm text-red-600 dark:text-red-400">{{ field.errors.0 }}</p>{% endif %}
</div>
{% endif %}
{% endfor %}
