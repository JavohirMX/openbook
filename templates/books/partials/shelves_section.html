<h3 class="section-title mb-3 text-base" title="Custom tags — reading status shelves are set above">
  Shelves
  <span class="sr-only">Custom tags — reading status shelves are set above</span>
</h3>
<div class="flex flex-wrap gap-2 mb-4">
  {% for shelf in book_shelves %}
  <span class="badge-tag inline-flex items-center gap-1 text-xs px-2 py-0.5">
    {{ shelf.name }}
    <form method="post" action="{% url 'web:book-unshelve' book.pk %}" class="inline"
          hx-post="{% url 'web:book-unshelve' book.pk %}" hx-target="#shelves-section" hx-swap="innerHTML">
      {% csrf_token %}
      <input type="hidden" name="shelf_id" value="{{ shelf.pk }}">
      <button type="submit" class="px-1 text-neutral-600 dark:text-neutral-400 hover:text-red-600 dark:hover:text-red-400" aria-label="Remove from {{ shelf.name }}">×</button>
    </form>
  </span>
  {% empty %}
  <span class="text-sm text-neutral-600 dark:text-neutral-400">Not on any shelves.</span>
  {% endfor %}
</div>
<form method="post" action="{% url 'web:book-shelve' book.pk %}" data-disable-on-submit
      hx-post="{% url 'web:book-shelve' book.pk %}" hx-target="#shelves-section" hx-swap="innerHTML"
      class="flex flex-wrap gap-3 items-end">
  {% csrf_token %}
  <div>
    <label for="id_shelf" class="block text-sm text-neutral-600 dark:text-neutral-400 mb-1">Add to shelf</label>
    <select name="shelf" id="id_shelf" class="input w-auto min-w-[12rem]">
      {% for s in shelve_form.fields.shelf.queryset %}
      <option value="{{ s.pk }}">{{ s.name }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn-primary text-sm" data-loading-text="Adding…">Add</button>
</form>
