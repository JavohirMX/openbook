{% if quotes %}
<ul class="space-y-4 mb-6">
  {% for quote in quotes %}
  <li class="border-l-2 border-neutral-300 dark:border-neutral-600 pl-4">
    <blockquote class="text-neutral-700 dark:text-neutral-300 text-sm italic">"{{ quote.text }}"</blockquote>
    {% if quote.position %}<p class="text-xs text-neutral-500 dark:text-neutral-400 mt-1">{{ quote.position }}</p>{% endif %}
    <form method="post" action="{% url 'web:book-quote-delete' book.pk quote.pk %}" class="mt-2" onsubmit="return confirm('Delete this quote?')">{% csrf_token %}
      <button type="submit" class="text-xs text-red-600 dark:text-red-400 hover:underline">Delete</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% endif %}
<form method="post" action="{% url 'web:book-quote' book.pk %}">{% csrf_token %}
  {{ quote_form.text }}
  <div class="mt-3">{{ quote_form.position.label_tag }} {{ quote_form.position }}</div>
  <button type="submit" class="btn-primary text-sm mt-4">Add quote</button>
</form>
