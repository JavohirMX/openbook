<p class="text-sm text-neutral-600 dark:text-neutral-400 mb-3">
  Search catalogs and free public libraries for this book.
</p>
{% if provider_links %}
<div class="flex flex-wrap gap-1.5">
  {% for link in provider_links %}
  <a href="{{ link.url }}"
     class="inline-flex items-center gap-1 px-2.5 py-1 text-xs border border-neutral-300 dark:border-neutral-700
            hover:bg-neutral-100 dark:hover:bg-neutral-800
            focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-950 dark:focus-visible:ring-neutral-300
            transition-colors duration-150"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="{{ link.name }} (opens in new tab)">
    <span>{{ link.name }}</span>
    <svg class="w-3 h-3 shrink-0 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
    </svg>
  </a>
  {% endfor %}
</div>
{% else %}
<p class="text-sm text-neutral-500 dark:text-neutral-400">No online sources available for this book.</p>
{% endif %}
