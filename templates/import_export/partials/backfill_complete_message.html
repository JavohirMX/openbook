<div class="metrics-strip" role="list">
  <div class="metrics-strip-item" role="listitem">
    <p class="text-2xl font-bold text-neutral-950 dark:text-neutral-100 tabular-nums">{{ job.result.updated|default:0 }}</p>
    <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">Updated</p>
  </div>
  <div class="metrics-strip-item" role="listitem">
    <p class="text-2xl font-bold text-neutral-950 dark:text-neutral-100 tabular-nums">{{ job.result.skipped|default:0 }}</p>
    <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">Skipped</p>
  </div>
  <div class="metrics-strip-item" role="listitem">
    <p class="text-2xl font-bold text-neutral-950 dark:text-neutral-100 tabular-nums">{{ job.result.pending_review|default:0 }}</p>
    <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">Pending review</p>
  </div>
  <div class="metrics-strip-item" role="listitem">
    <p class="text-2xl font-bold text-neutral-950 dark:text-neutral-100 tabular-nums">{{ job.result.failed|default:0 }}</p>
    <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">Failed</p>
  </div>
</div>
