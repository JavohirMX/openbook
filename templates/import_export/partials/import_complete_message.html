<div class="metrics-strip" role="list">
  <div class="metrics-strip-item" role="listitem">
    <p class="text-2xl font-bold text-neutral-950 dark:text-neutral-100 tabular-nums">{{ job.result.added }}</p>
    <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">Added</p>
  </div>
  <div class="metrics-strip-item" role="listitem">
    <p class="text-2xl font-bold text-neutral-950 dark:text-neutral-100 tabular-nums">{{ job.result.skipped }}</p>
    <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">Skipped</p>
  </div>
  <div class="metrics-strip-item" role="listitem">
    <p class="text-2xl font-bold text-neutral-950 dark:text-neutral-100 tabular-nums">{{ job.result.failed }}</p>
    <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">Failed</p>
  </div>
</div>
