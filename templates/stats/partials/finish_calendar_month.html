<div class="w-[17.5rem]">
  <p class="text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-2">{{ finish_calendar.label }}</p>
  <div class="border border-neutral-200 dark:border-neutral-800 text-[11px] leading-none">
    <div class="grid grid-cols-7 border-b border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-800/40">
      {% for label in finish_calendar.weekday_labels %}
      <div class="h-7 flex items-center justify-center font-medium text-neutral-500 dark:text-neutral-400">{{ label }}</div>
      {% endfor %}
    </div>
    {% for week in finish_calendar.weeks %}
    <div class="grid grid-cols-7{% if not forloop.last %} border-b border-neutral-200 dark:border-neutral-800{% endif %}">
      {% for cell in week %}
        {% if cell.day %}
        <button
          type="button"
          class="relative h-9 flex items-center justify-center border-r border-neutral-200 dark:border-neutral-800 last:border-r-0 transition-colors
            {% if cell.intensity == 1 %}bg-emerald-100 dark:bg-emerald-900/50{% elif cell.intensity == 2 %}bg-emerald-200 dark:bg-emerald-800/60{% elif cell.intensity == 3 %}bg-emerald-400 dark:bg-emerald-700/70{% elif cell.intensity == 4 %}bg-emerald-600 text-white dark:bg-emerald-500{% endif %}
            {% if cell.is_today %}ring-1 ring-inset ring-neutral-950 dark:ring-neutral-100 font-semibold{% endif %}
            {% if cell.count %}hover:opacity-90{% else %}hover:bg-neutral-50 dark:hover:bg-neutral-800/40{% endif %}"
          title="{{ cell.count }} finished"
          hx-get="{% url 'web:stats-finished-on' finish_calendar.year finish_calendar.month cell.day %}"
          hx-target="#finish-day-modal-body"
          hx-swap="innerHTML"
          onclick="openFinishDayModal()"
        >
          {{ cell.day }}
        </button>
        {% else %}
        <div class="h-9 border-r border-neutral-200 dark:border-neutral-800 last:border-r-0 bg-neutral-50/50 dark:bg-neutral-900/30" aria-hidden="true"></div>
        {% endif %}
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</div>
