<div class="text-center py-14 px-4 surface-padded max-w-md mx-auto">
  <svg class="w-12 h-12 mx-auto text-neutral-300 dark:text-neutral-600 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
  </svg>
  <p class="text-lg font-medium text-neutral-800 dark:text-neutral-200 mb-2">{{ title }}</p>
  {% if description %}<p class="text-sm text-neutral-500 dark:text-neutral-400 mb-8 max-w-sm mx-auto">{{ description }}</p>{% endif %}
  {% if cta_url and cta_label %}
  <a href="{{ cta_url }}" class="btn-primary">{{ cta_label }}</a>
  {% endif %}
  {% if secondary_url and secondary_label %}
  <p class="mt-4 text-sm">
    <a href="{{ secondary_url }}" class="link">{{ secondary_label }}</a>
  </p>
  {% endif %}
</div>
