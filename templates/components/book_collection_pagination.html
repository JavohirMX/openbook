{% load book_extras %}
{% if page_obj.has_other_pages %}
<nav class="flex justify-center gap-2 mt-4" aria-label="Book list pagination">
  {% if page_obj.has_previous %}
  <a href="?{% book_query page=page_obj.previous_page_number %}"
     class="btn-secondary px-4 text-sm"
     hx-get="{% url 'web:book-list' %}?{% book_query page=page_obj.previous_page_number %}"
     hx-target="#book-list"
     hx-indicator="#book-list-loading">Previous</a>
  {% endif %}
  <span class="min-h-11 px-4 inline-flex items-center text-sm text-neutral-600 dark:text-neutral-400" {% if page_obj.has_other_pages %}aria-current="page"{% endif %}>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a href="?{% book_query page=page_obj.next_page_number %}"
     class="btn-secondary px-4 text-sm"
     hx-get="{% url 'web:book-list' %}?{% book_query page=page_obj.next_page_number %}"
     hx-target="#book-list"
     hx-indicator="#book-list-loading">Next</a>
  {% endif %}
</nav>
{% endif %}
