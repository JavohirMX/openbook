<div class="metrics-strip" role="list">
  {% for item in items %}
  <div class="metrics-strip-item" role="listitem">
    <p class="text-2xl font-bold text-neutral-950 dark:text-neutral-100 tabular-nums">{{ item.value }}{% if item.suffix %}{{ item.suffix }}{% endif %}</p>
    <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">{{ item.label }}</p>
  </div>
  {% endfor %}
</div>
