<div class="relative">
  <input type="{{ type|default:'password' }}" name="{{ name }}" id="{{ id }}" {% if required %}required{% endif %} {% if autofocus %}autofocus{% endif %} class="input pr-16" value="{{ value|default:'' }}">
  <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 min-h-11 px-2 text-sm text-neutral-600 dark:text-neutral-400 hover:text-neutral-950 dark:hover:text-neutral-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-neutral-950 dark:focus-visible:ring-neutral-300" data-password-toggle aria-controls="{{ id }}" aria-pressed="false">Show</button>
</div>
